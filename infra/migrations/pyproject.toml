[project]
name = "inalpha-migrations"
version = "0.2.0"
description = "Inalpha database migrations (alembic + psycopg)"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "psycopg[binary]>=3.3.0",
    "python-dotenv>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: requires a dedicated PostgreSQL *_test database"]

[tool.ruff]
line-length = 88
